[package]
name = "md_server"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
test-util = []

[dependencies]
core_lib = { path = "../core_lib" }
md_proto = { path = "../md_proto" }
md_wire = { path = "../md_wire" }
binance_spot = { path = "../venues/binance_spot" }
bitstamp = { path = "../venues/bitstamp" }
anyhow = "1.0.104"
bytes = "1.12.1"
h2 = "0.4.16"
http = "1.5.0"
oneshot = { version = "0.2.1", features = ["std", "async"] }
prost = "0.14.4"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "time",
    "net",
    "io-util",
] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tikv-jemallocator = "0.7.0"
heapless = "0.9.3"

[dev-dependencies]
md_server = { path = ".", features = ["test-util"] }
# Where tonic lives. The end-to-end tests drive the hand-written server with a real gRPC
# client generated from the same `.proto`, which is what proves it is gRPC rather than
# something gRPC-shaped. No cycle: `md_client` does not depend on this crate.
md_client = { path = "../md_client" }
tonic = "0.14.6"
tonic-prost = "0.14.6"
http = "1.5.0"
# The same crate as the dependency above, with the in-memory instrument registrar
# (`core_lib::venue::test_util`) turned on - `#[cfg(test)]`-gated items in `core_lib` are not
# visible from here, and this crate's own tests need to register instruments the way a
# connector's listing refresh would.
core_lib = { path = "../core_lib", features = ["test_util"] }
# The same crate as the dependency above, with `start_paused` for the sweep tests. Resolver 3
# keeps this feature out of a plain build.
tokio = { version = "1.53.1", features = [
    "macros",
    "rt",
    "sync",
    "test-util",
    "time",
] }

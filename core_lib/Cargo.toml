[package]
name = "core_lib"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
all_venues = { path = "../venues/all_venues" }
heapless = "0.9.3"
crossbeam-utils = {version = "0.8.22"}
hashbrown = "0.17.1"
triomphe = "0.1.16"
tokio = {version = "1.53.1", features = ["sync", "rt", "time", "macros"]}
serde = "1.0.229"
oneshot = { version = "0.2.1", features = ["std", "async"] }
anyhow = "1.0.104"
tracing.workspace = true
# "std" is what gates `FutureExt::catch_unwind`, which `venue::connection` wraps every
# session in; "sink" is the websocket write half.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
bytes = "1.12.1"
simd-json = "0.18"
thiserror = "2"
# `SlotTable`'s per-frame symbol lookup only; see its doc for why not the default hasher.
rustc-hash = "2.1.3"

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

# Not built under `--cfg loom`: tokio compiles `tokio::net` out of a loom build, so anything
# that touches a socket cannot link there. `lib.rs` gates the modules that use these off to
# match, leaving the loom targets with just `shared_buffer` and `atomic_waker` - which is all
# they model.
[target.'cfg(not(loom))'.dependencies]
reqwest = "0.13.4"
tokio-tungstenite = { version = "0.26.2", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }

[dev-dependencies]
# The same crate as the dependency above, with `start_paused` for the connection tests. Only
# ever enabled for test builds - resolver 3 keeps dev-dependency features out of a plain build.
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "test-util", "time"] }

[features]
# In-memory transport doubles (`venue::test_util`) for tests in this crate and in the venue
# crates, which cannot see `#[cfg(test)]` items across a crate boundary.
test_util = []
# Counts where each price update lands, so the `cold_path()` hint on `IncrementalBook`'s deep
# branch can be checked against live venue traffic instead of assumed. Off by default: it is
# an atomic increment on the per-level path, which is the path in question. See
# `incremental_book::depth_stats`.
book_stats = []

[lints]
workspace = true

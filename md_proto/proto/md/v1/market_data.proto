syntax = "proto3";

package md.v1;

// Top-of-book fan-out, over a plain TCP connection rather than gRPC. One book per
// connection: the client sends one SubscribeBookRequest naming its pairs, the server
// answers with a status header, and then streams BookUpdates until it closes the socket.
// Every message on the wire is preceded by its length as a little-endian uint32; see
// `md_server::framing` for the exact framing and status codes.
//
// The server encodes each book once and hands the same bytes to every attached client.

message Pair {
  // "binance_spot" or "bitstamp", case-insensitive.
  string venue = 1;
  // The venue's own symbol, case-insensitive; non-empty ASCII alphanumerics.
  string symbol = 2;
}

message SubscribeBookRequest {
  // At least one, no duplicates. Every pair is validated, but only the first is
  // served today - merging the rest into one book is the next stage.
  repeated Pair pairs = 1;
}

message Level {
  double price = 1;
  double size  = 2;
  // Which venue quoted this level. One value across a whole book today; once books
  // are merged, levels on one side will carry different venues.
  string venue = 3;
}

// Every field tag here is <= 15, so each key costs a single byte. A scalar field
// added past tag 15 costs one extra byte on every message that carries it.
message BookUpdate {
  // Best first, at most 10 levels each. Both sides empty means the connector has no
  // book - see the existing resync note, which is unchanged.
  repeated Level asks = 1;
  repeated Level bids = 2;
  // asks[0].price - bids[0].price. NaN when either side is empty.
  double spread       = 3;
}

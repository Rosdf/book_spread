syntax = "proto3";

package md.v1;

// Top-of-book fan-out over gRPC. One book per connection: the client asks the server what it
// carries with GetCatalogue, then opens SubscribeBook naming one of the instrument indices
// that answer gave it, and the server streams BookUpdates until it ends the stream with a
// status.
//
// The server encodes each book once - length prefix and all - and hands the same buffer
// to every attached client. That is why it does not use tonic: a generated codec would
// re-encode the message per client. See `md_wire::grpc` for the framing constants and the
// refusal codes, and `md_server::client` for the fan-out itself.
//
// Identity on this wire is numeric, with one exception. A `Level` carries the index of the
// venue that quoted it rather than that venue's name, both resolved through the catalogue,
// which is the only message that spells a venue index out. A subscribe, though, names its
// instrument by index *and* by the pairs the catalogue listed under it - see
// `SubscribeBookRequest` for why an index alone is not enough.

service MarketData {
  // One book per stream. A refusal arrives as a Trailers-Only response whose
  // `grpc-status` says what kind of problem it was, and whose `md-reject-code` metadata
  // carries the exact reason - see `md_wire::grpc::RejectCode`.
  rpc SubscribeBook(SubscribeBookRequest) returns (stream BookUpdate);
  // What this server carries: the venue index table, and every instrument it will serve.
  rpc GetCatalogue(CatalogueRequest) returns (CatalogueResponse);
}

message CatalogueRequest {}

message CatalogueResponse {
  repeated VenueEntry      venues      = 1;
  repeated InstrumentEntry instruments = 2;
}

// Indices are explicit fields rather than positions in the list, so the server's own
// numbering is what travels and this response can be hand-encoded without building a map
// first.
message VenueEntry {
  uint32 idx  = 1;
  // "binance_spot", "bitstamp".
  string name = 2;
}

message InstrumentEntry {
  uint32 idx          = 1;
  repeated Pair pairs = 2;
}

message Pair {
  uint32 venue_idx = 1;
  // The venue's own spelling, case-sensitive: "BTCUSDT" on binance_spot, "btcusd" on
  // bitstamp.
  string symbol    = 2;
}

// A pair as a subscribe names it, both halves spelled out.
//
// The venue by name rather than by its CatalogueResponse.venues index: that index is the
// server's own numbering, fixed when it was built, so an index echoed at a differently-built
// server could match while meaning another venue. The name is what identifies a venue.
message SubscribePair {
  // "binance_spot", "bitstamp" - as CatalogueResponse.venues spells it.
  string venue  = 1;
  // The venue's own spelling, case-sensitive: "BTCUSDT" on binance_spot, "btcusd" on bitstamp.
  string symbol = 2;
}

message SubscribeBookRequest {
  // An idx from CatalogueResponse.instruments. Every pair under it is subscribed, and their
  // books are merged into the one book this stream carries.
  uint32 instrument_idx = 1;
  // Every pair CatalogueResponse listed under `instrument_idx`, in the order it listed them.
  // An index is a *position* in the server's catalogue file, so it means something different
  // after that file gains or loses an entry; naming the pairs is what lets the server refuse
  // a subscribe whose index no longer means what the client read. Required: a request that
  // names none is refused.
  repeated SubscribePair pairs = 2;
}

message Level {
  double price = 1;
  double size  = 2;
  // Which venue quoted this level, as an index into CatalogueResponse.venues. Levels on one
  // side carry different venues whenever the instrument names more than one pair - the book
  // is the merge of every pair's, best first, and a venue with nothing to quote is simply
  // absent from it.
  uint32 venue_idx = 3;
}

// Every field tag here is <= 15, so each key costs a single byte. A scalar field
// added past tag 15 costs one extra byte on every message that carries it.
message BookUpdate {
  // Best first, at most 10 levels each, across every venue rather than per venue. Both
  // sides empty means no venue has a book - each one publishes the empty book while it
  // resyncs, and a venue that does contributes no levels to this one.
  repeated Level asks = 1;
  repeated Level bids = 2;
  // asks[0].price - bids[0].price. NaN when either side is empty.
  double spread       = 3;
}
